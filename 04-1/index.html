<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 소개</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --accent: #2f6fed;
      --border: #e4e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --card: #1e242b;
        --text: #e8ecf1;
        --muted: #9aa5b1;
        --accent: #6f9cff;
        --border: #2f3842;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    section h2 {
      margin: 0 0 16px;
      font-size: 1.25rem;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
      display: inline-block;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 8px 16px;
    }

    dt {
      color: var(--muted);
      font-weight: 600;
    }

    dd {
      margin: 0;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 12px;
      font-size: 0.9rem;
    }

    .hobby {
      margin-bottom: 16px;
    }

    .hobby:last-child {
      margin-bottom: 0;
    }

    .hobby h3 {
      margin: 0 0 4px;
      font-size: 1.05rem;
    }

    .hobby p {
      margin: 0;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>홍길동</h1>
      <p>문서 작성과 기획을 하는 사람입니다.</p>
    </header>

    <section id="profile">
      <h2>자기소개</h2>
      <dl>
        <dt>이름</dt>
        <dd>홍길동</dd>
        <dt>하는 일</dt>
        <dd>문서 작성과 기획</dd>
        <dt>관심 분야</dt>
        <dd>
          <div class="tags">
            <span class="tag">AI 도구</span>
            <span class="tag">글쓰기</span>
            <span class="tag">Git</span>
          </div>
        </dd>
      </dl>
    </section>

    <section id="hobby">
      <h2>취미</h2>
      <article class="hobby">
        <h3>글쓰기</h3>
        <p>떠오른 생각을 짧은 메모로 남기고, 나중에 하나의 글로 다듬는 것을 좋아합니다.</p>
      </article>
      <article class="hobby">
        <h3>읽기</h3>
        <p>기술 문서와 에세이를 함께 읽습니다. 읽은 내용은 정리해서 보관합니다.</p>
      </article>
      <article class="hobby">
        <h3>산책</h3>
        <p>머리가 복잡할 때는 걸으면서 생각을 정리합니다. 주말에는 한 시간씩 걷습니다.</p>
      </article>
    </section>

    <footer>
      이 페이지는 profile.md와 hobby.md의 내용을 바탕으로 만들었습니다.
    </footer>
  </main>
</body>
</html>
